<app-toast></app-toast>

<div class="flex flex-col justify-center items-center fondo min-h-screen px-4 py-8">
  <div class="w-full max-w-sm">
    <div class="bg-white px-8 py-8 rounded-2xl shadow-xl">

      <div class="mb-7">
        <img src="assets/Color-nombre.png" alt="logo" class="mx-auto h-28 w-auto" />
      </div>

      <form (ngSubmit)="enviaDatos()" method="POST" class="flex flex-col gap-6">

        <div class="input-form-text">
          <label for="email">Correo electrónico</label>
          <input [(ngModel)]="email" id="email" type="email" name="email" required autocomplete="email" />
          @if (valEmail) { <p>Este campo es obligatorio</p> }
        </div>

        <div class="input-form-text">
          <label for="password">Contraseña</label>
          <input [(ngModel)]="password" id="password" type="password" name="password" required autocomplete="current-password" />
          @if (valPassword) { <p>Este campo es obligatorio</p> }
        </div>

        <button type="submit" class="btn-primary w-full flex justify-center">Iniciar sesión</button>
      </form>

      <div class="flex justify-end mt-2">
        <a routerLink="/recuperar-contrasena" class="text-xs text-gray-400 hover:text-gray-500">Olvidé mi contraseña</a>
      </div>

      <div class="mt-4">
        <div class="flex items-center gap-4">
          <div class="flex-1 border-t border-gray-200"></div>
          <p class="text-sm text-nowrap text-gray-400">Ingresar con:</p>
          <div class="flex-1 border-t border-gray-200"></div>
        </div>

        <button (click)="loginGoogle()" type="button" class="mt-4 btn-secondary w-full flex items-center justify-center gap-3">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="h-5 w-5 shrink-0">
            <path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335" />
            <path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4" />
            <path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05" />
            <path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.2654 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853" />
          </svg>
          <span class="text-sm font-semibold">Google</span>
        </button>

        <div class="border-t border-gray-200 mt-6"></div>
        <p class="mt-4 text-center text-sm text-gray-400">
          <a routerLink="registro" class="font-semibold hover:text-gray-600">Registrarme</a>
        </p>
      </div>

    </div>
  </div>
</div>
