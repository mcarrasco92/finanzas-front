<app-toast></app-toast>

<div class="px-6 py-1 flex items-center justify-between">

  <!-- Label pill -->
  <div class="flex items-center bg-gray-100 rounded-full p-1">
    <span class="px-4 py-1.5 text-sm font-medium rounded-full bg-white shadow-sm text-gray-900">
      Categorías
    </span>
  </div>

  <!-- Toggle desactivadas -->
  <div class="input-form-check">
    <span class="span-label">
      <label>Mostrar categorías desactivadas</label>
    </span>
    <div class="check-switch check-default group bg-gray-200 has-checked:bg-orange-400">
      <span class="span-border"></span>
      <input type="checkbox" [(ngModel)]="mostrarCatDesactivadas" (change)="onToggleCatDesactivadas()"/>
    </div>
  </div>

  <!-- Add button -->
  @if (isCategorias()) {
    <button (click)="abrirCategoriasModal()"
      class="flex bg-white items-center gap-1.5 px-4 py-2 text-sm font-medium text-green-800 border border-gray-200 rounded-full hover:bg-gray-50 transition-colors cursor-pointer">
      <span class="text-base leading-none font-semibold">+</span>
      Nueva categoría
    </button>
  }

</div>

<div class="my-4">
  <router-outlet></router-outlet>
</div>
