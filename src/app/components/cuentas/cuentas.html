<app-toast></app-toast>

<div class="px-6 py-1 flex items-center justify-between">

  <!-- Pill tab switcher -->
  <div class="flex items-center bg-gray-100 rounded-full p-1 gap-0.5">
    <button
      (click)="navegarDebito()"
      class="px-4 py-1.5 text-sm font-medium rounded-full transition-all cursor-pointer"
      [ngClass]="isDebito() ? 'bg-blue-500 shadow-sm text-white' : 'text-gray-500 hover:text-gray-700'">
      Débito
    </button>
    <button
      (click)="navegarTDC()"
      class="px-4 py-1.5 text-sm font-medium rounded-full transition-all cursor-pointer"
      [ngClass]="isTDC() ? 'bg-indigo-500 shadow-sm text-white' : 'text-gray-500 hover:text-gray-700'">
      Crédito
    </button>
  </div>

  <!-- Add button -->
  @if (isDebito() && btnNuevaCuenta) {
    <button (click)="nuevaCuenta()"
      class="flex bg-white items-center gap-1.5 px-4 py-2 text-sm font-medium text-green-800 border border-gray-200 rounded-full hover:bg-gray-50 transition-colors cursor-pointer">
      <span class="text-base leading-none font-semibold">+</span>
      Añadir Nueva Cuenta
    </button>
  }
  @if (isTDC() && btnNuevaTDC) {
    <button (click)="nuevaTDC()"
      class="flex bg-white items-center gap-1.5 px-4 py-2 text-sm font-medium text-green-800 border border-gray-200 rounded-full hover:bg-gray-50 transition-colors cursor-pointer">
      <span class="text-base leading-none font-semibold">+</span>
      Añadir Nueva Tarjeta
    </button>
  }

</div>

<div class="my-4">
  <router-outlet></router-outlet>
</div>
