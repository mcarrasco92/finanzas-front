<app-toast></app-toast>
<app-loading *ngIf="isLoading"></app-loading>

<nav class="relative bg-white shadow-sm">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 justify-between">
      <div class="flex">
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <!-- Current: "border-indigo-600 text-gray-900", Default: "border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700" -->
          <a [routerLink]="'/dashboard/cuentas/debito'"
            class="inline-flex items-center border-b-2 border-orange-400 px-1 pt-1 text-sm font-medium text-gray-900 cursor-pointer">Cuentas
            de débito</a>
          <a
            class="inline-flex items-center border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700 cursor-pointer">Tarjetas
            de crédito</a>
        </div>
      </div>
      
      <div class="flex items-center">

        <div *ngIf="agregaCuenta" class="hidden sm:ml-6 sm:flex sm:items-center">
          <button type="button" (click)="nuevaCuenta()"
            class="block rounded-md bg-orange-400 px-3 py-2 text-center text-sm font-semibold text-white shadow-xs hover:bg-orange-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Nueva cuenta</button>
        </div>

        
      </div>

    </div>
  </div>
</nav>

<div class="my-4">
  <router-outlet></router-outlet>
</div>
