<app-toast></app-toast>
<app-loading *ngIf="isLoading"></app-loading>

<div class="px-4 py-6 bg-white shadow-sm">
    
    <h1 class="text-lg font-medium leading-6 text-gray-900 mb-10 w-full text-center border-b border-gray-900/10 pb-4" >{{cuenta.id ? "Consulta" : "Alta"}} de cuenta</h1>
    <form (ngSubmit)="enviaDatos()" method="POST" class="space-y-8">

        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-4">
            
            <div class="input-form-text">
                <label for="nombreCuenta">Nombre</label>
                <input [(ngModel)]="cuenta.nombre" id="nombreCuenta" type="text" name="nombreCuenta" autocomplete="off" [disabled]="!editar && cuenta.id" [ngClass]="{'bg-gray-100': !editar, 'bg-white': editar}" />
                <p *ngIf="valNombre">Este campo es obligatorio</p>
            </div>
            

            <div class="input-form-text">
                <label for="descipcion">Descripción</label>
                <input [(ngModel)]="cuenta.descripcion" id="descipcion" type="text" name="descipcion" autocomplete="off" [disabled]="!editar && cuenta.id" [ngClass]="{'bg-gray-100': !editar, 'bg-white': editar}" />
                <p *ngIf="valDescripcion">Este campo es obligatorio</p>
            </div>

            <div class="input-form-text">
                <label for="institucion">Institución</label>
                <input [(ngModel)]="cuenta.institucion" id="institucion" type="text" name="institucion" autocomplete="off" [disabled]="!editar && cuenta.id" [ngClass]="{'bg-gray-100': !editar, 'bg-white': editar}"/>
                <p *ngIf="valInstitucion">Este campo es obligatorio</p>
            </div>

            
            <div class="input-form-currency">
              <div>$</div>

              <label for="saldo">Saldo</label>
              <input [(ngModel)]="saldo" (keydown)="detectarTecla($event)" (input)="formatearSaldo($event)" (blur)="actualizaSaldo()" placeholder="0.00" id="saldo" type="text" name="saldo" autocomplete="off" [disabled]="cuenta.id !== ''" [ngClass]="{'bg-gray-100': cuenta.id}" />
              <p *ngIf="valSaldo">Este campo es obligatorio</p>
            </div>
            

        </div>


        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-4">

            <div class="input-form-check">
                <span class="span-label">
                    <label id="inversion-label">Inversión</label>
                </span>
                <div class="check-switch group"
                    [ngClass]="{'has-checked:bg-indigo-900 bg-gray-300': !editar, 'has-checked:bg-indigo-600 bg-gray-200': editar}">
                    <span class="span-border"></span>
                    <input [(ngModel)]="cuenta.inversion" id="inversion" type="checkbox" name="inversion" [disabled]="!editar && cuenta.id" aria-labelledby="inversion-label"/>
                </div>
            </div>


            <div class="input-form-check" *ngIf="cuenta.inversion">
                <span class="span-label">
                    <label id="vista-label">A la vista</label>
                </span>
                <div class="check-switch group"
                    [ngClass]="{'has-checked:bg-indigo-900 bg-gray-400': !editar, 'has-checked:bg-indigo-600 bg-gray-200': editar}">
                    <span class="span-border"></span>
                    <input [(ngModel)]="cuenta.vista" id="vista" type="checkbox" name="vista" aria-labelledby="vista-label" [disabled]="!editar && cuenta.id"/>
                </div>
            </div>

        </div>

        <div class="pt-6 flex items-center justify-end gap-x-6 border-t border-gray-900/10 relative h-10">
            <button *ngIf="cuenta.id" (click)="activaDesactivaCuenta()" type="button" class="btn-danger absolute left-0">{{cuenta.activa ? "Desactivar cuenta" : "Activar cuenta"}}</button>
            <button *ngIf="editar && cuenta.id" (click)="cancelaEdicion()" type="button" class="btn-secondary">Cancelar</button>
            <button *ngIf="editar || !cuenta.id" type="submit" class="btn-primary">Guardar</button>
            <button *ngIf="!editar && cuenta.id && cuenta.activa" (click)="editar=true" type="button" class="btn-primary">Editar</button>
          </div>
    </form>
</div>


<div class="p-4 bg-white shadow-sm mt-5">
    <h1 class="text-lg font-medium leading-6 text-gray-900 mb-10 w-full text-center">Transacciones</h1>
    <div class="px-4 sm:px-6 lg:px-8">
      <div class="mt-1 flow-root">
        <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
          <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
            <table class="relative min-w-full divide-y divide-gray-300">
              <thead>
                <tr>
                  <th scope="col" class="py-3.5 pr-3 pl-4 text-left text-sm font-semibold text-gray-900 sm:pl-0">Nombre
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Institución</th>
                  <th scope="col" class="px-3 py-3.5 text-center text-sm font-semibold text-gray-900">Inversión</th>
                  <th scope="col" class="px-3 py-3.5 text-center text-sm font-semibold text-gray-900">Tasa Anual</th>
                  <th scope="col" class="px-3 py-3.5 text-center text-sm font-semibold text-gray-900">A la vista</th>
                  <th scope="col" class="px-3 py-3.5 text-center text-sm font-semibold text-gray-900">Saldo actual</th>
  
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                <tr class="cursor-pointer hover:bg-gray-50">
                  <td class="py-4 pr-3 pl-4 text-sm font-medium whitespace-nowrap text-gray-900 sm:pl-0">sdfsdf</td>
                  <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500">sdfsdf</td>
                  <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 text-center">sdfsdf</td>
                  <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 text-center">sdfsdf</td>
                  <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 text-center">sdfsdfsd</td>
                  <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 text-center">sdfsdf</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  
  
  
  </div>
