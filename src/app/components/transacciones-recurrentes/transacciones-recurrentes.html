<app-toast></app-toast>

<div class="px-6 py-1 flex items-center justify-between">

  <!-- Pill tab switcher -->
  <div class="flex items-center bg-gray-100 rounded-full p-1 gap-0.5">
    <button
      (click)="tipoMovimiento = 'Egreso'"
      class="px-4 py-1.5 text-sm font-medium rounded-full transition-all cursor-pointer"
      [ngClass]="tipoMovimiento == 'Egreso' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'">
      Cargos recurrentes
    </button>
    <button
      (click)="tipoMovimiento = 'Ingreso'"
      class="px-4 py-1.5 text-sm font-medium rounded-full transition-all cursor-pointer"
      [ngClass]="tipoMovimiento == 'Ingreso' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500 hover:text-gray-700'">
      Ingresos recurrentes
    </button>
  </div>

  <!-- Add button -->
  <button (click)="abrirModal()"
    class="flex bg-white items-center gap-1.5 px-4 py-2 text-sm font-medium text-green-800 border border-gray-200 rounded-full hover:bg-gray-50 transition-colors cursor-pointer">
    <span class="text-base leading-none font-semibold">+</span>
    Nuevo {{ tipoMovimiento == 'Egreso' ? 'cargo' : 'ingreso' }} recurrente
  </button>

</div>

<div class="space-y-3 mt-4">
  @for (trans of transacciones; track trans.id) {
    @if (tipoMovimiento == trans.tipo) {
      <div
        class="bg-white rounded-xl border border-gray-100 shadow-sm px-5 py-3 flex items-center gap-4 cursor-pointer transition-shadow hover:shadow-md"
        (click)="consultaTransaccion(trans)">

        <!-- Avatar -->
        <div
          class="flex-shrink-0 h-10 w-10 rounded-full flex items-center justify-center text-sm font-semibold"
          [ngClass]="getAvatarClass(trans)">
          {{ getInitials(trans) }}
        </div>

        <!-- Concepto + cuenta/tarjeta + periodicidad -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-gray-900 text-sm">{{ trans.concepto }}</span>
            <span class="badge-periodicidad">{{ trans.periodicidad }}</span>
          </div>
          <p class="text-sm text-gray-400 mt-0.5">{{ consultaCuentaTarjeta(trans) }}</p>
        </div>

        <!-- Importe -->
        <div class="text-right mr-2">
          <p class="text-xs font-medium text-gray-400 uppercase tracking-wide">Importe</p>
          <p class="text-base font-semibold text-gray-900">$ {{ trans.importe | number:'1.2-2' }}</p>
        </div>

        <!-- Chevron -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="flex-shrink-0 w-4 h-4 text-gray-300">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </div>
    }
  }
</div>

<app-transacciones-recurrentes-modal *ngIf="modalAbierto" (cerrar)="cerrarModal()" [tipoMovimiento]="tipoMovimiento"></app-transacciones-recurrentes-modal>
