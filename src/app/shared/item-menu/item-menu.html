<li class="hover:bg-gray-100 rounded-md duration-300 ease-in-out text-gray-600">
    <a [routerLink]="link" routerLinkActive="bg-indigo-100 text-gray-800"
        class="group flex gap-x-3 rounded-md p-2 text-sm/6 text-gray-600">

        <!--Cuentas-->
        <div *ngIf="nombre === 'Cuentas'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" />
            </svg>
        </div>

        <!--Movimeintos-->
        <div *ngIf="nombre === 'Mov. recurrentes'">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
              </svg>
        </div>

        {{nombre}}
    </a>
</li>
